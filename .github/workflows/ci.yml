# Compila e fa girare i test a ogni push e pull request su master.
name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build-test:
    name: Compilazione e test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Compilazione
        run: dotnet build Navifox.sln -c Release -nologo

      - name: Test
        run: dotnet test Navifox.sln -c Release --no-build -nologo --logger "console;verbosity=normal"
